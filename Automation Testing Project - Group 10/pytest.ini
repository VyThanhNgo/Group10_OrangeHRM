[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
junit_family = xunit2
addopts =
    -ra
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
    --junitxml=reports/results.xml
    --html=reports/report.html
    --self-contained-html
markers =
    tc(steps, expected): mô tả Steps / Expected của testcase (lấy từ Excel của nhóm)
